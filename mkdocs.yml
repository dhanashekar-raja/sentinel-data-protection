
site_name: Sentinel Data Protection
site_description: Enterprise data protection product documentation
site_author: Documentation Engineering Team

site_url: https://dhanashekar-raja.github.io/sentinel-data-protection/

repo_url: https://github.com/dhanashekar-raja/sentinel-data-protection
repo_name: sentinel-data-protection

theme:
  name: material
  language: en
  icon: docs/assets/images/favicon.png
  favicon: assets/images/favicon.png
  custom_dir: overrides
  header:
    logo: docs/assets/images/favicon.png
    logo_alt: Sentinel Data Protection
    title: Sentinel Data Protection
    version: 1.0
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: docs
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dhanashekar-raja/sentinel-data-protection

nav:
  - Home: index.md

  - Getting Started: getting-started.md

  - Installation: installation.md

  - Configuration: configuration.md

  - Administration:
      - Overview: administration/index.md
      - User Management: administration/user-management.md
      - Access Control: administration/access-control.md
      - Audit Logs: administration/audit-logs.md

  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Common Issues: troubleshooting/common-issues.md
      - Installation Issues: troubleshooting/installation-issues.md

  - Release Notes:
      - Version 1.0: release-notes/release-1.0.md

