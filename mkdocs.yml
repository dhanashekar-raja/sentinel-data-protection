
site_name: Sentinel Data Protection
site_description: Enterprise data protection product documentation
site_author: Documentation Engineering Team

site_url: https://dhanashekar-raja.github.io/sentinel-data-protection/

repo_url: https://github.com/dhanashekar-raja/sentinel-data-protection
repo_name: sentinel-data-protection

theme:
  name: material
  language: en

  palette:
    - scheme: default
      primary: Gray
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: Gray
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true


nav:
  - Home: index.md

  - Getting Started: getting-started.md

  - Installation: installation.md

  - Configuration: configuration.md

  - Administration:
      - Overview: administration/index.md
      - User Management: administration/user-management.md
      - Access Control: administration/access-control.md
      - Audit Logs: administration/audit-logs.md

  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Common Issues: troubleshooting/common-issues.md
      - Installation Issues: troubleshooting/installation-issues.md

  - Release Notes:
      - Version 1.0: release-notes/release-1.0.md

