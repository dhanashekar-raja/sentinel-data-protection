
openapi: 3.1.0

info:
  title: Sentinel Data Protection API
  version: 1.0.0
  description: |
    Illustrative API documentation for the
    Sentinel Data Protection portfolio project.

servers:
  - url: https://api.sentinel.example.com/v1
    description: Illustrative API server

security:
  - BearerAuth: []

tags:
  - name: Policies
    description: Operations for managing data protection policies.
  - name: Secure Sharing
    description: Operations for creating and managing secure file-sharing links.

paths:
  /policies:
    get:
      summary: Retrieve all policies
      # Existing GET operation

      operationId: listPolicies
      tags:
        - Policies
      responses:
        "200":
          description: Successfully retrieved policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"

        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Unauthorized:
                  summary: Authentication failed
                  value:
                    code: UNAUTHENTICATED
                    message: A valid access token is required.

        "403":
          description: Insufficient permissions to access policies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: 
                Forbidden:
                  summary: Access denied
                  value:
                    code: FORBIDDEN
                    message: You do not have permission to access policies.

        "500":
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples: 
                Forbidden:
                  summary: Internal server error
                  value:
                    code: INTERNAL_SERVER_ERROR
                    message: An unexpected error occurred while processing the request.

    post:
      summary: Create a policy
      # Existing POST operation
      
      operationId: createPolicy
      tags:
        - Policies
      requestBody:
        required: true
        description: Information required to create a policy.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
      responses:
        "201":
          description: Policy created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Invalid policy information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sharing-links:
    post:
      summary: Create a secure sharing link
      description: |
        Creates a secure sharing link for a specified file.
        Administrators can configure its expiration period
        and optionally restrict access to specified email addresses.
      operationId: createSharingLink
      tags:
        - Secure Sharing
      requestBody:
        required: true
        description: Information required to create a sharing link.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSharingLinkRequest"
            example:
              fileId: FILE-1001
              expirationDays: 7
              allowedEmails:
                - user@example.com
                - partner@example.com
      responses:
        "201":
          description: Sharing link created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingLink"
              example:
                linkId: LINK-5001
                fileId: FILE-1001
                url: https://share.example.com/LINK-5001
                status: active
                expiresAt: "2026-11-17T10:00:00Z"
        "400":
          description: The request contains invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_REQUEST
                message: One or more sharing-link fields are invalid.
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: UNAUTHENTICATED
                message: A valid access token is required.
        "403":
          description: The caller does not have permission to create sharing links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FORBIDDEN
                message: You do not have permission to create sharing links.
        "404":
          description: The specified file was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FILE_NOT_FOUND
                message: The specified file could not be found.
        "409":
          description: The request conflicts with the current resource state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: CONFLICT
                message: The sharing-link request conflicts with the current file state.
        "429":
          description: The API rate limit has been exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: RATE_LIMIT_EXCEEDED
                message: Too many requests. Try again later.
        "500":
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred while processing the request.

  /policies/{policyId}:
    get:
      summary: Retrieve a policy
      operationId: getPolicy
      tags:
        - Policies
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "200":
          description: Policy retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update a policy
      operationId: updatePolicy
      tags:
        - Policies
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      requestBody:
        required: true
        description: Updated policy information.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdateRequest"
      responses:
        "200":
          description: Policy updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a policy
      operationId: deletePolicy
      tags:
        - Policies
      parameters:
        - $ref: "#/components/parameters/PolicyId"
      responses:
        "204":
          description: Policy deleted successfully.
        "404":
          description: Policy not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    PolicyId:
      name: policyId
      in: path
      required: true
      description: Unique identifier of the policy.
      schema:
        type: string
        examples: 
          - POL-001

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Policy:
      type: object
      description: Represents a data protection policy.
      properties:
        id:
          type: string
          examples: 
            - POL-001
        name:
          type: string
          examples: 
            - Confidential Data Policy
        description:
          type: string
          examples: 
            - Protects confidential business information.
        status:
          type: string
          enum:
            - active
            - inactive
          examples: 
            - active
        createdAt:
          type: string
          format: date-time
          examples: 
            - "2026-11-06T10:30:00Z"
      required:
        - id
        - name
        - status

    PolicyCreateRequest:
      type: object
      properties:
        name:
          type: string
          examples: 
            - Confidential Data Policy
        description:
          type: string
          examples: 
            - Protects confidential business information.
        status:
          type: string
          enum:
            - active
            - inactive
          examples: 
            - active
      required:
        - name
        - status

    PolicyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          examples: 
            - Updated Confidential Data Policy
        description:
          type: string
          examples: 
            - Updated policy description.
        status:
          type: string
          enum:
            - active
            - inactive
          examples: 
            - inactive
      required:
        - name
        - status

    PolicyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
      required:
        - data

    CreateSharingLinkRequest:
      type: object
      description: Request body for creating a secure sharing link.
      properties:
        fileId:
          type: string
          description: Unique identifier of the file to share.
          examples:
            - FILE-1001
        expirationDays:
          type: integer
          description: Number of days before the sharing link expires.
          minimum: 1
          maximum: 30
          examples:
            - 7
        allowedEmails:
          type: array
          description: Email addresses permitted to access the shared file.
          maxItems: 10
          items:
            type: string
            format: email
          examples:
            - - user@example.com
              - partner@example.com
      required:
        - fileId
        - expirationDays

    SharingLink:
      type: object
      description: Details of a generated secure sharing link.
      properties:
        linkId:
          type: string
          description: Unique identifier of the sharing link.
          examples:
            - LINK-5001
        fileId:
          type: string
          description: Identifier of the shared file.
          examples:
            - FILE-1001
        url:
          type: string
          format: uri
          description: Generated URL used to access the shared file.
          examples:
            - https://share.example.com/LINK-5001
        status:
          type: string
          description: Current status of the sharing link.
          enum:
            - active
            - revoked
            - expired
          examples:
            - active
        expiresAt:
          type: string
          format: date-time
          description: Date and time when the sharing link expires, in UTC.
          examples:
            - "2026-11-17T10:00:00Z"
      required:
        - linkId
        - fileId
        - url
        - status
        - expiresAt

    ErrorResponse:
      type: object
      description: Standard structure returned when an API request fails.
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
        message:
          type: string
          description: Human-readable explanation of the error.
      required:
        - code
        - message